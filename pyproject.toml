[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-state-io"
version = "0.7.0"
description = "Typed evidence-state envelopes and deterministic negative-claim gating"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = []
authors = [{ name = "Evidence-State I/O contributors" }]
keywords = ["ai", "evidence", "coverage", "provenance", "tool-protocols"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "build>=1.5,<2",
  "coverage>=7.15,<8",
  "mypy>=2.3,<3",
  "pytest>=9,<10",
  "ruff>=0.16,<0.17",
]

[project.scripts]
evidence-state = "evidence_state_io.cli:main"
evidence-state-mcp = "evidence_state_io.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidence_state_io = ["py.typed", "benchmarks/*.json"]

[tool.coverage.run]
branch = true
source = ["evidence_state_io"]
omit = [
  "*/evidence_state_io/__main__.py",
  "*/evidence_state_io/advance.py",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
disable_error_code = ["no-any-return", "unreachable"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
