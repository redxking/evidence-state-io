name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate tag and package version
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) is None:
              raise SystemExit(f"release tag must be stable SemVer vMAJOR.MINOR.PATCH, got {tag!r}")
          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = metadata["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match project version {version!r}")
          PY
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main

      - name: Install project and build tooling
        run: python -m pip install '.[dev]' 'build==1.5.0'

      - name: Run release checks
        run: |
          bash -n scripts/*.sh
          ruff check src tests scripts
          ruff format --check src tests scripts
          mypy src/evidence_state_io
          node tests/test_dashboard.js
          python scripts/build_site.py --output .site-build
          node tests/test_site_demo.js
          python -m compileall -q -f src
          python -m pip check
          coverage run --branch -m pytest -p no:cacheprovider -q
          coverage report --fail-under=90
          evidence-state demo --all > "${RUNNER_TEMP}/evidence-state-demo-all.json"
          python - <<'PY'
          import json
          from pathlib import Path

          # MVP-ACC-025 is the row this release establishes: it binds the tag,
          # notes, checksums, evidence manifest, SBOM, limitations, and accepted
          # commit that only exist once the release has been published.
          # Requiring it to be PASS before publishing would make any release
          # impossible, so it is checked for absence of an adverse status here
          # and recorded as PASS from the published release afterwards.
          SELF = "MVP-ACC-025"
          ledger = json.loads(Path("project/acceptance.json").read_text(encoding="utf-8"))
          rows = {row["id"]: row["status"] for row in ledger["criteria"]}
          if SELF not in rows:
              raise SystemExit(f"acceptance ledger does not declare {SELF}")
          unresolved = sorted(
              identifier
              for identifier, status in rows.items()
              if identifier != SELF and status != "PASS"
          )
          if unresolved:
              raise SystemExit("release acceptance rows are not PASS: " + ", ".join(unresolved))
          if rows[SELF] not in {"PASS", "UNVERIFIED"}:
              raise SystemExit(f"{SELF} is {rows[SELF]}; resolve it before releasing")
          PY

      - name: Build distributions
        run: python -m build

      - name: Verify built wheel in an isolated environment
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-check"
          "${RUNNER_TEMP}/wheel-check/bin/python" -m pip install dist/*.whl
          # Verify the released distribution outside the checkout, with a decoy
          # artifact directory beside the caller.
          mkdir -p "${RUNNER_TEMP}/isolated/benchmarks"
          printf '{"not": "a corpus"}\n' > "${RUNNER_TEMP}/isolated/benchmarks/emptybench-p0-corpus.json"
          printf '{"not": "an oracle"}\n' > "${RUNNER_TEMP}/isolated/benchmarks/emptybench-p0-oracle.json"
          ( cd "${RUNNER_TEMP}/isolated"
            env -u PYTHONPATH "${RUNNER_TEMP}/wheel-check/bin/evidence-state" --help
            env -u PYTHONPATH "${RUNNER_TEMP}/wheel-check/bin/evidence-state" demo --all
          ) > "${RUNNER_TEMP}/wheel-demo-all.json"

      - name: Generate checksums
        run: |
          python scripts/generate_release_evidence.py \
            --repo . \
            --artifacts dist \
            --output dist \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}"
          cp release/LIMITATIONS.md dist/LIMITATIONS.md

      - name: Preserve verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/EVIDENCE-MANIFEST.json
            dist/SBOM.spdx.json
            dist/LIMITATIONS.md
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing: an OIDC identity minted for this job, scoped to this
    # repository, workflow, and environment. No API token exists to leak,
    # rotate, or misplace, and nothing in the repository or on a laptop holds a
    # publishing credential.
    environment:
      name: testpypi
      url: https://test.pypi.org/p/evidence-state-io
    permissions:
      id-token: write
    steps:
      - name: Recover verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Keep only distribution files
        run: |
          find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete
          ls -1 dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.2)
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Install from TestPyPI and verify
    needs: publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Deliberately no checkout. Installing from the index into an empty
      # directory is the only way to test what a stranger actually gets, and it
      # is how ESIO-DEF-001 was found: a package that works inside its own
      # source tree and nowhere else looks identical until you leave the tree.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the published distribution
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m venv "${RUNNER_TEMP}/from-index"
          for attempt in 1 2 3 4 5 6; do
            if "${RUNNER_TEMP}/from-index/bin/python" -m pip install \
                 --index-url https://test.pypi.org/simple/ \
                 --no-deps "evidence-state-io==${version}"; then
              exit 0
            fi
            echo "index has not caught up yet; retrying in 20s"
            sleep 20
          done
          echo "the published distribution never became installable" >&2
          exit 1

      - name: Verify what a stranger receives
        run: |
          mkdir -p "${RUNNER_TEMP}/isolated/benchmarks"
          for artifact in emptybench-p0-corpus emptybench-p0-oracle \
            emptybench-p1-composed-corpus emptybench-p1-composed-oracle; do
            printf '{"not": "a benchmark artifact"}\n' \
              > "${RUNNER_TEMP}/isolated/benchmarks/${artifact}.json"
          done
          cd "${RUNNER_TEMP}/isolated"
          bin="${RUNNER_TEMP}/from-index/bin"
          "${bin}/evidence-state" --help > /dev/null
          "${bin}/evidence-state" demo --all > demo.json
          "${bin}/evidence-state" demo --benchmark composed --all > composed.json
          printf '{"jsonrpc":"2.0","id":1,"method":"tools/list"}\n' \
            | "${bin}/evidence-state-mcp" > mcp.jsonl
          "${bin}/python" - <<'CHECK'
          import json

          for name, pairs in (("demo.json", 12), ("composed.json", 6)):
              summary = json.load(open(name, encoding="utf-8"))["summary"]
              if not summary["all_passed"]:
                  raise SystemExit(f"{name}: benchmark did not pass from the index")
              if summary["pairs_discriminated"] != pairs:
                  raise SystemExit(f"{name}: expected {pairs} discriminated pairs")
              if summary["unsafe_permits"]:
                  raise SystemExit(f"{name}: unsafe permits from the published package")

          with open("mcp.jsonl", encoding="utf-8") as handle:
              tools = [
                  tool["name"]
                  for tool in json.loads(handle.readline())["result"]["tools"]
              ]
          expected = [
              "assess_negative_claim",
              "explain_rejection",
              "describe_evidence_requirements",
          ]
          if tools != expected:
              raise SystemExit(f"MCP server from the index listed {tools}")
          print("the published distribution behaves correctly outside any checkout")
          CHECK

  publish-pypi:
    name: Publish to PyPI
    # Only after the same artifacts were installed from an index and verified.
    # A PyPI version can never be replaced, so the irreversible step goes last.
    needs: [release, verify-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/evidence-state-io
    permissions:
      id-token: write
    steps:
      - name: Recover verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Keep only distribution files
        run: |
          find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete
          ls -1 dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.2)

  release:
    name: Attest and attach
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Recover verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Attest package build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Create MVP research-candidate GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            dist/EVIDENCE-MANIFEST.json dist/SBOM.spdx.json dist/LIMITATIONS.md \
            --verify-tag \
            --latest=false \
            --generate-notes \
            --title "${GITHUB_REF_NAME} — MVP research candidate" \
            --notes "MVP research-candidate release for synthetic, local, and authorized shadow evaluation. Assets include exact checksums, an evidence manifest, an SPDX SBOM, limitations, and build provenance. This release does not establish production readiness, external validation, authenticated evidence, source truth, or authorization for consequential use."
