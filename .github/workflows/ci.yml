name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install '.[dev]'

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: Compile package
        run: python -m compileall -q -f src

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -p no:cacheprovider

      - name: Check console entry point
        run: evidence-state --help

      - name: Run offline paired demo
        run: evidence-state demo > "${RUNNER_TEMP}/evidence-state-demo.json"

  compose-config:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate optional lab configuration
        run: docker compose --file compose.yaml --profile lab config --quiet
